name: tw-watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node watch.js
        env:
          TW_TOKEN: ${{ secrets.TW_TOKEN }}
          NTFY_TOPIC: treasurewars-krith-9f3k2
