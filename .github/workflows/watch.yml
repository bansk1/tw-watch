name: tw-watch
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
concurrency:
  group: tw-watch
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node watch.js
        env:
          TW_TOKEN: ${{ secrets.TW_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
